name: Build and Deploy 11ty

on:
  push:
    branches:
      - main
      - staging
  # schedule:
  #   - cron: '0 6 * * *'      # Daily rebuild at 6:00 UTC (8:00 CET / 7:00 GMT)
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild-schedule]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            src/_data/*.cache.json
          key: sheet-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sheet-data-${{ runner.os }}-
            sheet-data-
      
      - name: Restore student images cache
        uses: actions/cache@v4
        with:
          path: .cache/student-images
          key: student-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            student-images-${{ runner.os }}-
            student-images-
      
      - name: Clean and build CSS
        run: |
          npm run clean
          npm run build:css
        env:
          # main serves transpersonal-training.com from the domain root; staging
          # is still previewed under the malizia-g.github.io subpath below.
          PATH_PREFIX: ${{ github.ref == 'refs/heads/main' && '/' || '/transpersonaltraining/' }}

      - name: Restore cached student images into _site
        run: |
          if [ -d ".cache/student-images" ] && [ "$(ls -A .cache/student-images 2>/dev/null)" ]; then
            mkdir -p _site/assets/images/people/students
            cp -r .cache/student-images/* _site/assets/images/people/students/
            echo "✅ Restored $(ls _site/assets/images/people/students/ | wc -l) cached student images"
          fi

      - name: Build Eleventy
        run: npm run build:eleventy
        env:
          PATH_PREFIX: ${{ github.ref == 'refs/heads/main' && '/' || '/transpersonaltraining/' }}

      # ── staging preview only ──
      # main went live on the production host at cutover (Sep 2026), so its
      # canonicals are now true and this must not run for it. staging is still
      # previewed from malizia-g.github.io/transpersonaltraining/, where every
      # page canonicalises to the real domain — the same duplicate-content shape
      # the marketing plan flagged as urgent for test.transpersonal-training.com —
      # so the preview build stays noindexed.
      - name: Keep the staging preview out of search results
        if: github.ref != 'refs/heads/main'
        run: |
          # `noindex, follow`, and crawling deliberately left OPEN.
          #
          # Disallow would be the wrong tool here. It stops Googlebot fetching the
          # page, so it never sees the noindex — and anything already indexed then
          # lingers, because Google cannot recrawl to learn it should go. Allowing
          # the crawl and returning noindex is the combination that actually
          # removes pages. `follow` keeps the crawler moving through the internal
          # links, so it reaches every page that needs dropping.
          printf '%s\n' \
            '# Staging preview served from github.io. Every page returns' \
            '# noindex; crawling is left open on purpose so that directive is' \
            '# seen. Set by .github/workflows/deploy.yml.' \
            'User-agent: *' \
            'Allow: /' > _site/robots.txt
          # base.njk already emits a robots meta, so rewrite that one rather than
          # adding a second: two conflicting tags is a rule to rely on, one correct
          # tag is a fact.
          find _site -name '*.html' -print0 | xargs -0 sed -i \
            's|<meta name="robots" content="[^"]*">|<meta name="robots" content="noindex, follow">|g'
          missing=$(grep -L 'name="robots"' $(find _site -name '*.html') || true)
          if [ -n "$missing" ]; then echo "::error::pages without a robots meta:"; echo "$missing"; exit 1; fi
          echo "✅ $(grep -l 'noindex, follow' $(find _site -name '*.html') | wc -l) pages marked noindex"
          # sitemap.xml is left in place on purpose: it lists transpersonal-training.com
          # URLs, not github.io ones, and `keep_files: true` below means deleting it
          # here would not remove the already-published copy anyway.

      - name: Update student images cache
        run: |
          if [ -d "_site/assets/images/people/students" ] && [ "$(ls -A _site/assets/images/people/students 2>/dev/null)" ]; then
            mkdir -p .cache/student-images
            # --delete so a departed student's photo, now pruned from _site by
            # practiceClients.js, is not carried forward and restored next build.
            rsync -a --delete _site/assets/images/people/students/ .cache/student-images/
          fi
      
      - name: Deploy staging preview to deploy branch
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: deploy
          keep_files: true
          commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # Runs before the upload, and failing it means nothing is published. That is
      # the point: each of these breaks silently — the site keeps serving pages and
      # looks fine, while the damage shows up weeks later in Search Console.
      # A checklist in TODO.md cannot catch them; this can.
      - name: Verify the production build before publishing it
        if: github.ref == 'refs/heads/main'
        run: |
          fail=0
          note() { echo "::error::$1"; fail=1; }

          # The staging noindex step is gated to non-main. If that gate is ever
          # broken by an edit, this build would quietly deindex the live site.
          if grep -rl 'name="robots" content="noindex' _site --include='*.html' | grep -q .; then
            note "noindex found in a production build — the staging gate is broken"
            grep -rl 'name="robots" content="noindex' _site --include='*.html' | head
          fi

          # Without .htaccess every 301 disappears. The site still works, so nobody
          # notices, while the 32 teacher URLs — 64% of organic clicks — start 404ing.
          if [ ! -f _site/.htaccess ]; then
            note ".htaccess missing from the build — the whole redirect map would vanish"
          else
            grep -q 'jure-biechonski' _site/.htaccess \
              || note ".htaccess present but the teacher rules are gone"

            # Anchors need the NE flag; without it mod_rewrite emits %23 and the
            # redirect lands on a path that does not exist. This happened in production once.
            if grep '/teachers/#' _site/.htaccess | grep -qv 'NE'; then
              note "a /teachers/# rule is missing the NE flag — it would redirect to a 404"
            fi

            # ErrorDocument: Apache does not serve 404.html on its own.
            grep -q 'ErrorDocument 404' _site/.htaccess || note "ErrorDocument 404 not set"

            # The canonical rule must key off the proxy header: %{HTTPS} reads
            # "off" even on HTTPS here, so that variant loops the site off the air.
            grep -q 'X-Forwarded-Proto' _site/.htaccess \
              || note "the https rule is not using X-Forwarded-Proto — on this host the alternative loops"
          fi

          # robots.txt must not carry the staging preview's shape.
          grep -q 'Disallow: */ *$' _site/robots.txt && note "robots.txt disallows everything"
          grep -q 'transpersonal-training.com/sitemap.xml' _site/robots.txt \
            || note "robots.txt does not point at the production sitemap"

          # A build made with the staging PATH_PREFIX would fill the sitemap with
          # the wrong URLs and canonicalise every page to github.io.
          grep -q 'github.io' _site/sitemap.xml && note "sitemap contains github.io URLs"
          grep -qE '<loc>https://transpersonal-training\.com/' _site/sitemap.xml \
            || note "sitemap has no production URLs"

          [ -f _site/404.html ] || note "404.html missing"

          # Fonts and icons are self-hosted so that nothing about a visitor
          # reaches a third party — the claim the privacy modal makes. A stray
          # CDN reference would quietly break that promise, and look fine.
          if grep -rlE 'https?://[^"]*(googleapis|gstatic|unpkg|jsdelivr)' _site --include='*.html' | grep -q .; then
            note "a third-party font/script host is back in the HTML"
            grep -rlE 'https?://[^"]*(googleapis|gstatic|unpkg|jsdelivr)' _site --include='*.html' | head
          fi

          # The Person entities are what tell Google /teachers/ represents 32
          # people rather than one page that lists them — the markup carrying the
          # redirect strategy for 64% of organic clicks.
          grep -q '"@type": "Person"' _site/teachers/index.html \
            || note "Person schema missing from /teachers/"

          # Dimensions prevent the layout shifting as photos arrive. If the
          # transform silently stops matching, this is how we find out.
          if [ "$(grep -o '<img' _site/index.html | wc -l)" -gt 0 ] \
             && [ "$(grep -o '<img width="[0-9]*" height="[0-9]*"' _site/index.html | wc -l)" -lt 10 ]; then
            note "homepage images lost their width/height — CLS regression"
          fi

          [ "$fail" = "0" ] || { echo "Refusing to publish."; exit 1; }
          echo "✅ production build verified"

      # Production host is FTP-only (no FTPS/SFTP available), so credentials and
      # the file transfer itself are unencrypted on the wire — accepted because
      # it's what the host offers. `dangerous-clean-slate` is deliberately left
      # at its default (off): it would wipe the whole remote directory first,
      # which is one accidental misconfiguration away from taking the live site
      # down. Revisit only if orphaned old files on the host become a real problem.
      - name: Deploy to production via FTP
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./_site/
          # The FTP login lands one level ABOVE the web root, in a directory
          # Apache doesn't serve — the first deploy went there and the site
          # answered 403 until this was set. public_html/ is the real document
          # root; the secret stays as an override if the host ever moves it.
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
